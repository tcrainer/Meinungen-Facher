<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wortschatz-Jagd</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --blue-500: #3b82f6;
      --red-500: #ef4444;
      --green-500: #22c55e;
      --green-400: #4ade80;
      --purple-400: #c084fc;
      --purple-600: #9333ea;
      --pink-600: #db2777;
      --blue-600: #2563eb;
      --yellow-400: #facc15;
      --yellow-500: #eab308;
      --orange-500: #f97316;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--slate-900);
      color: #fff;
      min-height: 100vh;
    }

    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }

    /* SETUP */
    #setup-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .setup-box {
      max-width: 28rem;
      width: 100%;
      background: var(--slate-800);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
      padding: 2rem;
      border: 4px solid var(--slate-700);
    }

    .setup-title { text-align: center; margin-bottom: 2rem; }

    .setup-title h1 {
      font-size: 2.25rem;
      font-weight: 900;
      background: linear-gradient(to right, var(--purple-400), var(--pink-600));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .5rem;
    }

    .setup-title p { color: var(--slate-400); }

    .player-row { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }

    .player-badge {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; flex-shrink: 0; color: #fff;
    }

    .player-badge.p0 { background: var(--blue-500); }
    .player-badge.p1 { background: var(--red-500); }
    .player-badge.p2 { background: var(--green-500); }

    .player-input {
      flex: 1; background: var(--slate-700); border: 2px solid var(--slate-600);
      border-radius: .75rem; padding: .75rem 1rem; color: #fff; font-size: 1rem;
      outline: none; transition: border-color .2s;
    }

    .player-input:focus { border-color: var(--purple-600); }

    .remove-btn {
      background: none; border: none; color: var(--red-500);
      cursor: pointer; padding: .5rem; font-size: 1.5rem; line-height: 1;
    }

    .add-player-btn {
      width: 100%; padding: .75rem; border: 2px dashed var(--slate-600);
      border-radius: .75rem; background: none; color: var(--slate-400);
      cursor: pointer; font-size: 1rem; margin-bottom: 2rem; transition: all .2s;
    }

    .add-player-btn:hover { color: #fff; border-color: var(--slate-400); }

    .start-btn {
      width: 100%; padding: 1rem;
      background: linear-gradient(to right, var(--purple-600), var(--blue-600));
      border: none; border-radius: .75rem; color: #fff;
      font-weight: 700; font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); transition: transform .1s;
    }

    .start-btn:active { transform: scale(.95); }

    /* PLAYING */
    #play-screen { flex-direction: column; padding: 1rem; }
    @media (min-width: 768px) { #play-screen { padding: 2rem; } }

    .hud {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      align-items: center; background: var(--slate-800); padding: 1rem;
      border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
      margin-bottom: 2rem; border-bottom: 4px solid var(--slate-700);
    }

    .timer-box {
      display: flex; align-items: center; gap: .5rem;
      background: var(--slate-900); padding: .5rem 1rem;
      border-radius: .75rem; border: 2px solid var(--slate-700);
      font-family: 'Courier New', monospace; font-size: 1.5rem; font-weight: 900;
    }

    .timer-box.urgent { border-color: var(--red-500); color: var(--red-500); animation: pulse 1s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

    .scores-row { display: flex; gap: 1rem; margin-top: 1rem; }
    @media (min-width: 768px) { .scores-row { margin-top: 0; } }

    .score-card {
      display: flex; flex-direction: column; align-items: center;
      padding: .5rem 1rem; border-radius: .75rem;
      border: 2px solid var(--slate-700); background: var(--slate-900);
      opacity: .6; transition: all .3s;
    }

    .score-card.active-player { opacity: 1; transform: scale(1.1); box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); background: var(--slate-800); }
    .score-card.active-player.p0 { border-color: var(--blue-500); }
    .score-card.active-player.p1 { border-color: var(--red-500); }
    .score-card.active-player.p2 { border-color: var(--green-500); }

    .score-name { font-size: .875rem; font-weight: 700; }
    .score-name.p0 { color: var(--blue-500); }
    .score-name.p1 { color: var(--red-500); }
    .score-name.p2 { color: var(--green-500); }

    .score-value { font-size: 1.25rem; font-weight: 900; }

    .score-correct { display: flex; align-items: center; gap: .25rem; font-size: .75rem; color: var(--green-400); margin-top: .25rem; }

    .play-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    .current-turn { margin-bottom: 1.5rem; text-align: center; animation: bounce 1s infinite; }

    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .current-turn .label { color: var(--slate-400); font-size: 1.125rem; text-transform: uppercase; letter-spacing: .15em; }

    .current-turn .name { font-size: 2.25rem; font-weight: 900; }
    .current-turn .name.p0 { color: var(--blue-500); }
    .current-turn .name.p1 { color: var(--red-500); }
    .current-turn .name.p2 { color: var(--green-500); }

    .card-area { width: 100%; max-width: 42rem; display: flex; flex-direction: column; align-items: center; }
    .card-hint { color: var(--slate-400); margin-bottom: 1rem; font-weight: 500; text-align: center; }

    .flashcard {
      width: 100%; background: var(--slate-800); border-radius: 1.5rem;
      padding: 2.5rem; cursor: pointer; transition: all .5s;
      border: 4px solid var(--slate-600); box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: 300px; text-align: center;
    }

    @media (min-width: 768px) { .flashcard { padding: 4rem; } }
    .flashcard:not(.flipped):hover { border-color: #64748b; transform: scale(1.02); }
    .flashcard.flipped.p0 { border-color: var(--blue-500); }
    .flashcard.flipped.p1 { border-color: var(--red-500); }
    .flashcard.flipped.p2 { border-color: var(--green-500); }

    .flashcard .sentence { font-size: 1.875rem; font-weight: 700; line-height: 1.3; }
    @media (min-width: 768px) { .flashcard .sentence { font-size: 2.5rem; } }

    .flashcard .solution-label { font-size: .875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--slate-400); margin-bottom: 1rem; }

    .flashcard .solution { font-size: 1.875rem; font-weight: 700; color: var(--green-400); line-height: 1.3; animation: fadeIn .5s ease-out; }
    @media (min-width: 768px) { .flashcard .solution { font-size: 2rem; } }

    .flip-hint { position: absolute; bottom: 1.5rem; left: 0; right: 0; text-align: center; opacity: .5; font-size: .875rem; display: flex; justify-content: center; align-items: center; gap: .5rem; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .answer-buttons { display: flex; gap: 1.5rem; margin-top: 2rem; width: 100%; animation: fadeIn .5s ease-out; }

    .answer-btn {
      flex: 1; padding: 1rem; border-radius: 1rem; font-weight: 700;
      font-size: 1.5rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: .5rem; transition: all .2s; border: 2px solid;
    }

    .answer-btn.wrong { background: rgba(239,68,68,.15); color: var(--red-500); border-color: var(--red-500); }
    .answer-btn.wrong:hover { background: var(--red-500); color: #fff; }
    .answer-btn.correct { background: rgba(34,197,94,.15); color: var(--green-500); border-color: var(--green-500); }
    .answer-btn.correct:hover { background: var(--green-500); color: #fff; }

    .grid-area { width: 100%; max-width: 56rem; display: flex; flex-direction: column; align-items: center; animation: fadeIn .5s ease-out; }

    .grid-title { font-size: 1.875rem; font-weight: 900; color: var(--yellow-400); margin-bottom: .5rem; display: flex; align-items: center; gap: .5rem; }
    .grid-subtitle { color: var(--slate-400); margin-bottom: 1.5rem; }

    .reward-grid {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem;
      width: 100%; background: var(--slate-800); padding: 1rem;
      border-radius: 1.5rem; border: 4px solid var(--slate-700);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
    }

    @media (min-width: 640px) { .reward-grid { grid-template-columns: repeat(8, 1fr); gap: .75rem; } }

    .tile {
      aspect-ratio: 1; border-radius: .75rem; font-weight: 900; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .5s; border: 2px solid transparent; cursor: pointer; color: #fff;
    }

    @media (min-width: 768px) { .tile { font-size: 1.125rem; } }

    .tile.unrevealed { box-shadow: 0 4px 6px -1px rgba(0,0,0,.3); }
    .tile.unrevealed:hover { transform: scale(1.1); }
    .tile.unrevealed.p0 { background: var(--blue-500); }
    .tile.unrevealed.p1 { background: var(--red-500); }
    .tile.unrevealed.p2 { background: var(--green-500); }

    .tile.revealed { background: var(--slate-900); color: var(--yellow-400); transform: scale(.95); cursor: default; }
    .tile.revealed.claimed-p0 { border-color: var(--blue-500); }
    .tile.revealed.claimed-p1 { border-color: var(--red-500); }
    .tile.revealed.claimed-p2 { border-color: var(--green-500); }

    /* GAME OVER */
    #gameover-screen { flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }

    .gameover-box {
      max-width: 40rem; width: 100%; background: var(--slate-800);
      border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
      padding: 2.5rem; border: 4px solid var(--yellow-500); text-align: center;
      position: relative; overflow: hidden;
    }

    .gameover-box .bg-glow { position: absolute; inset: 0; opacity: .1; pointer-events: none; background: radial-gradient(circle at center, var(--yellow-400), transparent 70%); }

    .trophy-icon { font-size: 5rem; margin-bottom: 1.5rem; animation: bounce 1s infinite; display: inline-block; }

    .gameover-title {
      font-size: 2.5rem; font-weight: 900;
      background: linear-gradient(to right, var(--yellow-400), var(--orange-500));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: .5rem;
    }

    .gameover-subtitle { font-size: 1.25rem; color: var(--slate-300); margin-bottom: 1.5rem; }

    .top-translator { background: rgba(51,65,85,.5); border-radius: .75rem; padding: 1rem; margin-bottom: 2rem; display: inline-block; border: 1px solid var(--slate-600); color: var(--green-400); }

    .final-scores { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; max-width: 28rem; margin-left: auto; margin-right: auto; width: 100%; }

    .final-row { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-radius: 1rem; border: 2px solid var(--slate-600); background: rgba(51,65,85,.5); }
    .final-row.winner { background: rgba(234,179,8,.15); border-color: var(--yellow-500); }

    .final-row .rank { width: 2rem; height: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: var(--slate-600); margin-right: 1rem; flex-shrink: 0; }
    .final-row.winner .rank { background: var(--yellow-500); color: #000; }

    .final-row .info { flex: 1; text-align: left; }
    .final-row .info .pname { font-size: 1.25rem; font-weight: 700; }
    .final-row .info .pcorrect { font-size: .875rem; color: var(--green-400); margin-top: .25rem; }
    .final-row .pscore { font-size: 1.5rem; font-weight: 900; }

    .restart-btn {
      padding: 1rem 2rem; background: var(--slate-700); border: none;
      border-radius: .75rem; color: #fff; font-weight: 700; font-size: 1.25rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: .5rem; transition: background .2s;
    }

    .restart-btn:hover { background: var(--slate-600); }
  </style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen" class="screen active">
  <div class="setup-box">
    <div class="setup-title">
      <h1>Wortschatz-Jagd</h1>
      <p>Übersetze laut und gewinne virtuelles Geld!</p>
    </div>
    <div id="player-list"></div>
    <button id="add-player-btn" class="add-player-btn">&#x2b; Dritten Spieler hinzufügen</button>
    <button class="start-btn" id="start-btn">&#9654; Spiel Starten</button>
  </div>
</div>

<!-- PLAYING -->
<div id="play-screen" class="screen">
  <div class="hud">
    <div class="timer-box" id="timer-box">
      <span>&#128339;</span>
      <span id="timer-display">5:00</span>
    </div>
    <div class="scores-row" id="scores-row"></div>
  </div>
  <div class="play-main">
    <div class="current-turn">
      <div class="label">Am Zug:</div>
      <div class="name" id="turn-name"></div>
    </div>
    <div id="card-mode" class="card-area">
      <p class="card-hint">Übersetze diesen Satz laut ins Deutsche, klicke dann auf die Karte!</p>
      <div class="flashcard" id="flashcard">
        <div id="card-front">
          <div class="sentence" id="card-en"></div>
          <div class="flip-hint" id="flip-hint">&#8635; Klicken zum Umdrehen</div>

          <div class="solution-label">Lösung:</div>
          <div class="solution" id="card-de"></div>
        </div>
      </div>
      <div class="answer-buttons" id="answer-buttons" style="display:none;">
        <button class="answer-btn wrong" id="btn-wrong">&#10060; Falsch</button>
        <button class="answer-btn correct" id="btn-correct">&#10004; Richtig!</button>
      </div>
    </div>
    <div id="grid-mode" class="grid-area" style="display:none;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div class="grid-title">&#128176; Wähle ein Feld, <span id="grid-player-name"></span>!</div>
        <div class="grid-subtitle">Hinter jedem Feld versteckt sich ein Geldbetrag.</div>
      </div>
      <div class="reward-grid" id="reward-grid"></div>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-screen" class="screen">
  <div class="gameover-box">
    <div class="bg-glow"></div>
    <div class="trophy-icon">&#127942;</div>
    <h1 class="gameover-title">Zeit abgelaufen!</h1>
    <p class="gameover-subtitle" id="winner-text"></p>
    <div class="top-translator" id="top-translator"></div>
    <div class="final-scores" id="final-scores"></div>
    <button class="restart-btn" id="restart-btn">&#8634; Neues Spiel starten</button>
  </div>
</div>

function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkGrid(){const g=[];for(let i=0;i<48;i++){const j=Math.random()>.9;g.push({id:i,value:j?REWARD_VALUES[6]:REWARD_VALUES[Math.floor(Math.random()*5)],revealed:false,claimedBy:null});}return shuffle(g);}
function drawCard(){curSentence=SENTENCES[Math.floor(Math.random()*SENTENCES.length)];flipped=false;}
function showScr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function renderSetup(){
  const l=document.getElementById('player-list');l.innerHTML='';
  players.forEach((p,i)=>{
    const r=document.createElement('div');r.className='player-row';
    r.innerHTML=`<div class="player-badge ${PB[i]}">${i+1}</div><input class="player-input" type="text" placeholder="Name von Spieler ${i+1}" maxlength="15" value="${p.name}" data-i="${i}">${players.length>2?`<button class="remove-btn" data-i="${i}">&times;</button>`:''}`;
    l.appendChild(r);
  });
  document.getElementById('add-player-btn').style.display=players.length<3?'block':'none';
  l.querySelectorAll('.player-input').forEach(inp=>inp.addEventListener('input',e=>{players[+e.target.dataset.i].name=e.target.value;}));
  l.querySelectorAll('.remove-btn').forEach(b=>b.addEventListener('click',e=>{players.splice(+e.target.dataset.i,1);renderSetup();}));
}

document.getElementById('add-player-btn').addEventListener('click',()=>{if(players.length<3){players.push({name:'',score:0,correctAnswers:0});renderSetup();}});

document.getElementById('start-btn').addEventListener('click',()=>{
  const v=players.filter(p=>p.name.trim());
  if(v.length<2){alert('Bitte geben Sie mindestens zwei Spielernamen ein.');return;}
  players=v.map(p=>({...p,score:0,correctAnswers:0}));
  grid=mkGrid();timeLeft=300;cpi=0;showingGrid=false;drawCard();
  showScr('play-screen');renderPlay();startTimer();
});

function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{timeLeft--;updTimer();if(timeLeft<=0){clearInterval(timerId);showScr('gameover-screen');renderGO();}},1000);}
function updTimer(){document.getElementById('timer-display').textContent=fmt(timeLeft);const b=document.getElementById('timer-box');timeLeft<60?b.classList.add('urgent'):b.classList.remove('urgent');}

function renderPlay(){
  updTimer();renderScores();
  const tn=document.getElementById('turn-name');tn.textContent=players[cpi].name;tn.className='name '+PB[cpi];
  if(showingGrid){document.getElementById('card-mode').style.display='none';document.getElementById('grid-mode').style.display='flex';renderGridUI();}
  else{document.getElementById('card-mode').style.display='flex';document.getElementById('grid-mode').style.display='none';renderCard();}
}

function renderScores(){
  const r=document.getElementById('scores-row');r.innerHTML='';
  players.forEach((p,i)=>{
    const d=document.createElement('div');d.className=`score-card ${i===cpi?'active-player '+PB[i]:''}`;
    d.innerHTML=`<span class="score-name ${PB[i]}">${p.name}</span><span class="score-value">£${p.score}</span><span class="score-correct">✓ ${p.correctAnswers}</span>`;
    r.appendChild(d);
  });
}

function renderCard(){
  const fr=document.getElementById('card-front'),bk=document.getElementById('card-back'),ab=document.getElementById('answer-buttons'),fc=document.getElementById('flashcard');
  document.getElementById('card-en').textContent=curSentence?curSentence.en:'';
  document.getElementById('card-de').textContent=curSentence?curSentence.de:'';
  document.getElementById('back-en').textContent=curSentence?curSentence.en:'';
  fc.className='flashcard';
  if(flipped){fr.style.display='none';bk.style.display='block';ab.style.display='flex';fc.classList.add('flipped',PB[cpi]);}
  else{fr.style.display='block';bk.style.display='none';ab.style.display='none';}
}

document.getElementById('flashcard').addEventListener('click',()=>{if(!flipped&&!showingGrid){flipped=true;renderCard();}});
document.getElementById('btn-wrong').addEventListener('click',()=>nextTurn());
document.getElementById('btn-correct').addEventListener('click',()=>{players[cpi].correctAnswers++;showingGrid=true;renderPlay();});

function nextTurn(){cpi=(cpi+1)%players.length;drawCard();showingGrid=false;renderPlay();}

function renderGridUI(){
  document.getElementById('grid-player-name').textContent=players[cpi].name;
  const c=document.getElementById('reward-grid');c.innerHTML='';
  grid.forEach((t,i)=>{
    const b=document.createElement('button');
    if(t.revealed){b.className=`tile revealed claimed-${PB[t.claimedBy]}`;b.textContent='£'+t.value;b.disabled=true;}
    else{b.className=`tile unrevealed ${PB[cpi]}`;b.textContent='?';b.addEventListener('click',()=>tileClick(i));}
    c.appendChild(b);
  });
}

function tileClick(i){
  if(grid[i].revealed||revealing)return;revealing=true;
  grid[i].revealed=true;grid[i].claimedBy=cpi;
  players[cpi].score+=grid[i].value;
  renderGridUI();renderScores();
  setTimeout(()=>{revealing=false;if(grid.every(t=>t.revealed)){clearInterval(timerId);showScr('gameover-screen');renderGO();}else nextTurn();},2000);
}

function renderGO(){
  const s=[...players].sort((a,b)=>b.score-a.score),w=s[0];
  document.getElementById('winner-text').innerHTML=`Der Gewinner ist <strong>${w.name}</strong> mit £${w.score}!`;
  const mx=Math.max(...players.map(p=>p.correctAnswers)),tn=players.filter(p=>p.correctAnswers===mx).map(p=>p.name);
  document.getElementById('top-translator').innerHTML=`✓ <strong>Top-Übersetzer (${mx} richtig):</strong> ${tn.join(', ')}`;
  const c=document.getElementById('final-scores');c.innerHTML='';
  s.forEach((p,i)=>{
    const d=document.createElement('div');d.className=`final-row ${i===0?'winner':''}`;
    d.innerHTML=`<div class="rank">${i+1}</div><div class="info"><div class="pname">${p.name}</div><div class="pcorrect">✓ ${p.correctAnswers} richtig</div></div><div class="pscore">£${p.score}</div>`;
    c.appendChild(d);
  });
}

document.getElementById('restart-btn').addEventListener('click',()=>{players=[{name:'',score:0,correctAnswers:0},{name:'',score:0,correctAnswers:0}];showScr('setup-screen');renderSetup();});

renderSetup();
</script>
</body>
</html>
